          { id: 'center_q3', title: '溫室檢定 3：對過去的肯定推測', stem: 'Looking at the messy ink on the page, you realize he ______ woken up in the middle of the night...', hint: '提示：看到凌亂的墨跡，推測他「當時一定有」半夜醒來記下靈感。', options: [{ key: 'A', text: 'must have' }, { key: 'B', text: 'should have' }, { key: 'C', text: 'cannot have' }, { key: 'D', text: 'may not have' }], answer: 'A', rationale: '<strong>正解 (A) must have。</strong><br>從「書頁上凌亂的墨跡（messy ink）」作為線索，對過去發生的事情做出「當時一定醒來趕快記下來」的強烈肯定推測，須用 <strong>must have + p.p.</strong>。(B) 表「當時應該做卻沒做」，與事實已記下來矛盾；(C) 表「當時不可能」，語意相反。' }

      right: {
        id: 'right', name: '右之門：失控的太空軌道控制室', subtitle: 'Orbit & Carbon Crisis', badgeColor: 'text-violet-300 border-violet-500/40 bg-violet-500/10', rewardId: 'orbitalKey',
        introCn: '你穿過紫色的時空門，身處模擬國際太空站的控制室。螢幕正閃爍著紅色的二氧化碳濃度警報！答對軌道檢定並組裝出緊急通訊句，就能啟動碳封存系統！',
        storyEn: `From the window of the space station, astronaut Kjell Lindgren looked down at Earth. His long struggle with asthma and years of hard work had finally <span class="vocab-chip" data-vocab="paid off">paid off</span>, yet he still longed to give back to society.<br><br>On the main monitor, <span class="vocab-chip" data-vocab="substantial">substantial</span> evidence shows that rising carbon <span class="vocab-chip" data-vocab="emissions">emissions</span> are an <span class="vocab-chip" data-vocab="inevitable">inevitable</span> threat. If we fail to develop an <span class="vocab-chip" data-vocab="alternative">alternative</span> to fossil fuels, humanity __[1]__ suffer devastating consequences. Fortunately, carbon capture and storage (CCS) aims to keep excess CO2 safely __[2]__ deep underground, buying us precious time in the battle against climate change.`,
        questions: [
          { id: 'right_q1', title: '軌道檢定 1：助動詞與必然結果', stem: 'If we fail to develop an alternative to fossil fuels, humanity ______ suffer devastating consequences.', hint: '提示：表達「勢必會、註定會」承受後果，且後方接原形動詞 suffer。', options: [{ key: 'A', text: 'is bound to' }, { key: 'B', text: 'is used to' }, { key: 'C', text: 'would rather' }, { key: 'D', text: 'cannot help' }], answer: 'A', rationale: '<strong>正解 (A) is bound to。</strong><br>後方接原形動詞 <em>suffer</em>，且搭配條件句語意「若不開發替代能源，人類『勢必／註定會』承受毀滅性後果」，<strong>be bound to + 原形動詞</strong> 正是「必定會、註定會」的高頻語塊。(B)(D) 後方須接 V-ing；(C) <em>would rather</em> 意為「寧願」，不合邏輯。' },
          { id: 'right_q2', title: '軌道檢定 2：受詞補語的被動分詞', stem: 'Carbon capture and storage (CCS) aims to keep excess CO2 safely ______ deep underground.', hint: '提示：CO2 與動詞 trap（封存／困住）之間是被動關係。', options: [{ key: 'A', text: 'trapping' }, { key: 'B', text: 'trapped' }, { key: 'C', text: 'to trap' }, { key: 'D', text: 'trap' }], answer: 'B', rationale: '<strong>正解 (B) trapped。</strong><br>受詞 <em>excess CO2</em>（過量的二氧化碳）與動詞 <em>trap</em>（困住／封存）之間為被動關係（CO2 是「被」封存在地底），因此受詞補語須用過去分詞 <strong>trapped</strong>（keep + O + p.p.）。' }

    const ACT3_QUESTIONS = [
      { id: 'act3_q1', title: '列車檢定 1：蘇活區與服裝規定（區分與獨特）', stem: 'In ancient times, nobles wore rare garments to ______ themselves ______ the commoners; similarly, SoHo’s vibrant artistic atmosphere makes it truly unique.', hint: '提示：表達「使…與…區分開來／與眾不同」的雙重介系詞動詞片語。', options: [{ key: 'A', text: 'set ... apart from' }, { key: 'B', text: 'leave ... up to' }, { key: 'C', text: 'strip ... of' }, { key: 'D', text: 'account ... for' }], answer: 'A', rationale: '<strong>正解 (A) set ... apart from。</strong><br>句意為「古代貴族穿著稀有服飾，使自己與平民『區分開來／與眾不同』」，對應服裝規定與紐約蘇活區單元的核心語塊 <strong>set A apart from B</strong>（等同於 keep A distinct from B）。' },
      { id: 'act3_q2', title: '列車檢定 2：阿嘉莎推理劇的懸念（交由…決定）', stem: 'Instead of revealing the culprit right away, the mystery playwright decided that the final verdict should be ______ the passengers on the train.', hint: '提示：阿嘉莎單元核心片語，表示「交由某人決定」。', options: [{ key: 'A', text: 'met with' }, { key: 'B', text: 'left up to' }, { key: 'C', text: 'taken seriously' }, { key: 'D', text: 'associated with' }], answer: 'B', rationale: '<strong>正解 (B) left up to。</strong><br>對應阿嘉莎・克莉絲蒂單元核心片語 <strong>be left up to + 對象</strong>（交由某人決定）。推理劇作家沒有直接公布兇手，而是把最終裁決權「交由列車上的乘客決定」。' },
      { id: 'act3_q3', title: '列車檢定 3：澳洲環島長征（複合形容詞與回報）', stem: 'Driving around Australia’s "Big Lap" and passing ______ hills along the way may seem like a lot of effort, but the payoff is certainly worthwhile.', hint: '提示：山丘是「被白雪覆蓋的」，複合形容詞中名詞用單數，動詞採被動過去分詞。', options: [{ key: 'A', text: 'snow-covering' }, { key: 'B', text: 'snow-covered' }, { key: 'C', text: 'covering-snow' }, { key: 'D', text: 'snows-covered' }], answer: 'B', rationale: '<strong>正解 (B) snow-covered。</strong><br>山丘（hills）是「被白雪覆蓋的」，名詞 <em>snow</em> 加上過去分詞 <em>covered</em> 構成複合形容詞 <strong>snow-covered</strong>（白雪覆蓋的），且複合形容詞中的名詞一律用單數。' },
      { id: 'act3_q4', title: '列車檢定 4：列車長規章（萬一…假設語氣）', stem: 'The conductor announced that if any passenger ______ lose their reservation ticket tonight, they will have to solve an extra riddle.', hint: '提示：主要子句為未來式 will have to，if 條件子句表達「萬一…」。', options: [{ key: 'A', text: 'should' }, { key: 'B', text: 'would' }, { key: 'C', text: 'might' }, { key: 'D', text: 'could' }], answer: 'A', rationale: '<strong>正解 (A) should。</strong><br>在 <em>if</em> 條件子句中，若主要子句為未來式（<em>will have to...</em>），條件子句搭配助動詞 <strong>should + 原形動詞</strong> 表示「萬一……（發生機率雖小但仍有可能）」。<em>would / might / could</em> 不用於此種未來「萬一」條件子句。' }

    const ACT4_QUESTIONS = [
      { id: 'act4_q1', title: '實驗室檢定 1：能量飲料的真相（句首被動分詞構句）', stem: '______ as an "instant energy booster," the neon energy drink actually contains excessive caffeine and sugar.', hint: '提示：主要子句主詞是「能量飲料」，它與動詞 advertise（宣傳）是主動還是被動？', options: [{ key: 'A', text: 'Advertising' }, { key: 'B', text: 'Advertised' }, { key: 'C', text: 'To advertise' }, { key: 'D', text: 'Having advertised' }], answer: 'B', rationale: '<strong>正解 (B) Advertised。</strong><br>主要子句主詞是 <em>the neon energy drink</em>（能量飲料），飲料是「被宣傳為（be advertised as...）」瞬間能量補充劑。省略連接詞與 be 動詞後，句首須保留過去分詞 <strong>Advertised</strong>（同課本 <em>Nicknamed the "happiness hormone"...</em> 結構）。' },
      { id: 'act4_q2', title: '實驗室檢定 2：生理反噬效應（句尾主動分詞構句表結果）', stem: 'Consuming too many energy drinks at night prevents your brain from resting, ______ a dangerous decline in concentration the next day.', hint: '提示：前面是完整句且無連接詞，表示「主動導致」後方的結果。', options: [{ key: 'A', text: 'lead to' }, { key: 'B', text: 'led to' }, { key: 'C', text: 'leading to' }, { key: 'D', text: 'to lead to' }], answer: 'C', rationale: '<strong>正解 (C) leading to。</strong><br>逗號前方已是完整主要子句，無連接詞連接時，後方動詞須改為分詞構句。前句事件「主動導致（lead to）」隔天專注力下降的結果，故用現在分詞 <strong>leading to</strong>（相當於 <em>, which leads to...</em>）。' },
      { id: 'act4_q3', title: '實驗室檢定 3：Unit 9 核心字彙與介系詞搭配', stem: 'The health report warned that excessive caffeine will severely ______ teenagers’ sleeping habits and heart rhythms.', hint: '提示：inter-（在…之間）+ fere（擊打）→ 干擾、妨礙睡眠。', options: [{ key: 'A', text: 'interfere with' }, { key: 'B', text: 'account for' }, { key: 'C', text: 'pay off' }, { key: 'D', text: 'make a note of' }], answer: 'A', rationale: '<strong>正解 (A) interfere with。</strong><br>句意為「過量咖啡因會嚴重『干擾／妨礙』青少年的睡眠習慣與心律」，<strong>interfere with</strong> 為本次段考極高頻動詞片語。' },
      { id: 'act4_q4', title: '實驗室檢定 4：U9 學習單核心（同位語 that vs. 關係子句 which）', stem: 'Medical researchers have provided substantial evidence for the fact ______ energy drinks cannot replace genuine rest.', hint: '提示：後方 energy drinks cannot replace genuine rest 是完整不缺受詞的句子，用來說明 the fact 的內容。', options: [{ key: 'A', text: 'which' }, { key: 'B', text: 'what' }, { key: 'C', text: 'that' }, { key: 'D', text: 'where' }], answer: 'C', rationale: '<strong>正解 (C) that。</strong><br>後方 <em>energy drinks cannot replace genuine rest</em> 主詞、動詞、受詞齊全，是完整子句，用來解釋前方抽象名詞 <em>the fact</em> 的具體內容，屬於<strong>同位語名詞子句</strong>，必須用 <strong>that</strong>，不可選 <em>which</em>！' }

    const ACT5_QUESTIONS = [
      { id: 'act5_q1', title: '終章檢定 1：包浩斯 vs. 慕夏的設計哲學', stem: 'Unlike Mucha’s highly decorative posters, Bauhaus designers believed that "form follows function" and argued that unnecessary ornaments should be ______ so users are not ______.', hint: '提示：不必要的裝飾應該被「剝除」，使用者才不會被「分心」。', options: [{ key: 'A', text: 'stripped away; distracted' }, { key: 'B', text: 'left up; exhausted' }, { key: 'C', text: 'met with; exposed' }, { key: 'D', text: 'paid off; identified' }], answer: 'A', rationale: '<strong>正解 (A) stripped away; distracted。</strong><br>包浩斯主張「形隨機能」，認為應該將不必要的裝飾「剝除（stripped away）」，讓使用者在操作現代介面時不會被過度裝飾「分心（distracted）」。' },
      { id: 'act5_q2', title: '終章檢定 2：直接空氣捕捉技術（DAC 文意選填核心）', stem: 'Traditional CCS is usually attached to factories; however, Direct Air Capture (DAC) machines can capture CO2 directly from the atmosphere, completely ______ specific industrial sources.', hint: '提示：in-（不）+ de-（下）+ pend（懸掛）→ 完全「獨立於」特定工業來源之外。', options: [{ key: 'A', text: 'independent of' }, { key: 'B', text: 'associated with' }, { key: 'C', text: 'exposed to' }, { key: 'D', text: 'reduced to' }], answer: 'A', rationale: '<strong>正解 (A) independent of。</strong><br>對比前句傳統碳捕捉必須「附著於（attached to）」工廠，新型 DAC 能直接從空氣捕捉二氧化碳，完全「獨立於（independent of）特定工業來源之外」。' },
      { id: 'act5_q3', title: '終章檢定 3：機械樹的規模換算（DAC 搭配詞）', stem: 'Although DAC efficiency is currently low, building thousands of these mechanical facilities would be ______ planting millions of real trees to combat climate change.', hint: '提示：equi-（相等）+ val（價值）→ 等同於、相當於種植百萬棵樹。', options: [{ key: 'A', text: 'reluctant to' }, { key: 'B', text: 'equivalent to' }, { key: 'C', text: 'used to' }, { key: 'D', text: 'superior than' }], answer: 'B', rationale: '<strong>正解 (B) equivalent to。</strong><br><strong>be equivalent to + N / V-ing</strong> 意為「等同於、相當於……」，句意指建造數千座 DAC 設施的效果「相當於種植數百萬棵真樹」。' },
      { id: 'act5_q4', title: '終章檢定 4：維京語言印記與高頻字彙辨析', stem: 'While the new policy caused a lot of public ______, historians agree that the Viking invasion had a ______ impact on everyday English pronouns like "they" and "their."', hint: '提示：contra-（反對）+ vers（轉）→ 爭議；pro-（深）+ found（底）→ 深遠的影響。', options: [{ key: 'A', text: 'controversy; profound' }, { key: 'B', text: 'destination; rigid' }, { key: 'C', text: 'exception; decorative' }, { key: 'D', text: 'restriction; fluent' }], answer: 'A', rationale: '<strong>正解 (A) controversy; profound。</strong><br>第一空 <em>cause a lot of controversy</em> 為「引起極大爭議」；第二空 <em>have a profound impact on...</em> 為「對……產生深遠的影響」（可與 <em>far-reaching</em> 替換）。' }

    const $main = document.getElementById('app-main');

      if (State.hp >= State.maxHp && State.san >= State.maxSan) { showToast('你的 HP 與理智值目前都是滿的，暫時不需要喝藥水。'); return; }
      AudioEngine.heal(); State.consumables.elixir -= 1;
      State.hp = Math.min(State.maxHp, State.hp + 25); State.san = Math.min(State.maxSan, State.san + 20);
      showToast('🧪 飲用解毒藥水！HP +25，理智值 +20'); saveProgress(); updateHUD();
    }

    function rollD20Encounter(stageKey, actionObj) {
      if (State.encounterLog[stageKey]) return;
      const modal = document.getElementById('dice-modal');
      const dieVisual = document.getElementById('dice-visual');
      const dieNum = document.getElementById('dice-number');
      const formula = document.getElementById('dice-formula');
      const verdict = document.getElementById('dice-verdict');
      const outcome = document.getElementById('dice-outcome');
      const closeBtn = document.getElementById('dice-close');
      const clsObj = State.playerClass ? CLASSES[State.playerClass] : CLASSES.scholar;
      const bonus = clsObj.stats[actionObj.stat] || 0;
      const rawRoll = Math.floor(Math.random() * 20) + 1;
      const total = rawRoll + bonus;

      document.getElementById('dice-context-label').textContent = `${ENCOUNTERS[stageKey].npc}｜${actionObj.stat} 檢定 (DC ${actionObj.dc})`;
      verdict.textContent = '擲骰檢定中...'; verdict.className = 'text-xl font-bold text-amber-300';
      outcome.textContent = ''; formula.textContent = `目標值 DC ${actionObj.dc}（職業 ${actionObj.stat} 加值 +${bonus}）`;
      closeBtn.classList.add('hidden'); dieVisual.classList.add('animate-dice');
      modal.classList.remove('hidden'); modal.classList.add('flex');

      let ticks = 0;
      const timer = setInterval(() => {
        ticks += 1; dieNum.textContent = Math.floor(Math.random() * 20) + 1; AudioEngine.diceTick();
        if (ticks >= 12) {
          clearInterval(timer); dieVisual.classList.remove('animate-dice'); dieNum.textContent = rawRoll;
          formula.textContent = `d20 骰出 [${rawRoll}] + ${actionObj.stat} 加值 [${bonus}] = 總計 ${total}（目標 DC ${actionObj.dc}）`;
          let vText = '', oText = '';
          if (rawRoll >= 18) {
            AudioEngine.correct(); vText = '🌟 大成功 (Critical Success)！'; verdict.className = 'text-xl font-bold text-emerald-300';
            State.xp += (actionObj.reward.xp || 20) + 25; State.hp = Math.min(State.maxHp, State.hp + 10);
            if (actionObj.reward.compass) State.consumables.compass += actionObj.reward.compass;
            if (actionObj.reward.scroll) State.consumables.scroll += actionObj.reward.scroll;
            if (actionObj.reward.elixir) State.consumables.elixir += actionObj.reward.elixir;
            oText = `${actionObj.successMsg} 因為擲出大成功，額外回復 10 HP 並再加 +25 XP！`;
          } else if (rawRoll <= 3) {
            AudioEngine.wrong(); vText = '💀 大失敗 (Critical Fail)！'; verdict.className = 'text-xl font-bold text-rose-400';
            State.hp = Math.max(10, State.hp - 10); State.san = Math.max(10, State.san - 5);
            oText = '糟糕！你不小心踩到阿嘉莎留下的香蕉皮，一頭栽進滿是單字卡的泥坑！HP -10、理智 -5，但你還是得面對接下來的試煉！';
          } else if (total >= actionObj.dc) {
            AudioEngine.correct(); vText = '✔ 檢定成功 (Success)！'; verdict.className = 'text-xl font-bold text-sky-300';
            State.xp += (actionObj.reward.xp || 20);
            if (actionObj.reward.compass) State.consumables.compass += actionObj.reward.compass;
            if (actionObj.reward.scroll) State.consumables.scroll += actionObj.reward.scroll;
            if (actionObj.reward.elixir) State.consumables.elixir += actionObj.reward.elixir;
            oText = actionObj.successMsg;
          } else {
            AudioEngine.wrong(); vText = '✖ 檢定未過 (Fail)'; verdict.className = 'text-xl font-bold text-amber-400';
            State.san = Math.max(10, State.san - 5);
            oText = '對方完全不吃這一套，還對你投以疑惑的目光（理智值 -5）。只好靠真實的英文實力正面迎戰了！';
          }
          State.encounterLog[stageKey] = { actionLabel: actionObj.label, roll: rawRoll, bonus, total, verdict: vText, outcome: oText };
          verdict.textContent = vText; outcome.textContent = oText; closeBtn.classList.remove('hidden'); saveProgress(); updateHUD();
        }
      }, 65);
    }

    function renderEncounterBox(stageKey) {
      const enc = ENCOUNTERS[stageKey]; if (!enc) return '';
      const done = State.encounterLog[stageKey];
      if (done) {
        return `<div class="rpg-card rounded-2xl p-4 border-indigo-500/40 space-y-1.5 animate-fade-in"><div class="flex items-center justify-between text-xs"><span class="font-bold text-indigo-300">🎲 TRPG 行動紀錄：${enc.npc}</span><span class="font-mono text-amber-300">${done.verdict} (總計 ${done.total})</span></div><p class="text-xs sm:text-sm text-slate-300">${done.outcome}</p></div>`;
      }
      return `<div class="rpg-card rounded-2xl p-5 border-indigo-500/40 space-y-3 animate-fade-in"><div class="flex items-center justify-between flex-wrap gap-2"><span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">🎲 TRPG 遭遇事件：${enc.npc}</span><span class="text-xs text-slate-400">可選一種方式擲 d20 檢定</span></div><p class="text-sm text-slate-200">${enc.prompt}</p><div class="grid grid-cols-1 gap-2">${enc.actions.map((act, idx) => `<button type="button" data-enc-stage="${stageKey}" data-enc-idx="${idx}" class="btn-enc-action text-left px-3.5 py-2.5 rounded-xl bg-slate-900/90 hover:bg-indigo-500/15 border border-slate-700 hover:border-indigo-400 text-xs sm:text-sm text-slate-100 cursor-pointer transition flex items-center justify-between gap-2"><span>${act.label}</span><span class="shrink-0 text-[11px] font-mono px-2 py-0.5 rounded bg-slate-800 text-amber-300">${act.stat} DC ${act.dc}</span></button>`).join('')}</div></div>`;
    }

    function recordAnswer(qObj, chosenKey, storeObj) {
      if (storeObj[qObj.id]) return;
      storeObj[qObj.id] = chosenKey;
      if (chosenKey === qObj.answer) {
        AudioEngine.correct();
        const bonusXp = State.playerClass === 'scholar' ? 10 : 0;
        State.xp += (25 + bonusXp);
        showToast(bonusXp ? '✅ 詠唱成功！獲得 25 + 10 (學者加成) XP' : '✅ 詠唱成功！獲得 25 XP');
      } else {
        AudioEngine.wrong();
        let hpLoss = 15;
        if (State.playerClass === 'ranger' && !State.rangerDodgeUsed) { State.rangerDodgeUsed = true; hpLoss = 0; showToast('🏹 語感遊俠被動發動：成功閃避本次 HP 扣血！'); }
        else { showToast('💥 咒語反噬！HP -15，理智 -10'); }
        State.hp = Math.max(10, State.hp - hpLoss); State.san = Math.max(10, State.san - 10);
        State.mistakes.push({ title: qObj.title, stem: qObj.stem, chosen: chosenKey, answer: qObj.answer, rationale: qObj.rationale });
      }
      saveProgress(); updateHUD();
    }

    function renderQuestionCard(qObj, storeObj) {
      const chosen = storeObj[qObj.id], isAnswered = Boolean(chosen), isCorrect = chosen === qObj.answer;
      const elimList = State.eliminatedOpts[qObj.id] || [], hasHint = Boolean(State.revealedHints[qObj.id]);
      return `
        <div class="rpg-card rounded-2xl p-4 sm:p-5 space-y-3 ${isAnswered && !isCorrect ? 'border-rose-500/40' : isAnswered ? 'border-emerald-500/40' : ''}">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-sky-500/15 text-sky-300 border border-sky-500/30">${qObj.title}</span>
            ${isAnswered ? (isCorrect ? '<span class="text-xs font-bold text-emerald-400">✔ 檢定通過</span>' : '<span class="text-xs font-bold text-rose-400">✘ 受到傷害</span>') : `<div class="flex items-center gap-1.5"><button type="button" data-use-compass="${qObj.id}" ${elimList.length > 0 || State.consumables.compass <= 0 ? 'disabled' : ''} class="px-2 py-1 rounded-lg text-[11px] bg-sky-500/15 hover:bg-sky-500/25 disabled:opacity-40 text-sky-300 border border-sky-500/30 cursor-pointer disabled:cursor-default">🧭 50/50 刪去</button><button type="button" data-use-scroll="${qObj.id}" ${hasHint || State.consumables.scroll <= 0 ? 'disabled' : ''} class="px-2 py-1 rounded-lg text-[11px] bg-amber-500/15 hover:bg-amber-500/25 disabled:opacity-40 text-amber-300 border border-amber-500/30 cursor-pointer disabled:cursor-default">📜 卷軸提示</button></div>`}
          </div>
          <p class="text-sm sm:text-base text-slate-100 font-medium leading-relaxed bg-slate-900/70 p-3 rounded-xl border border-slate-800">${qObj.stem}</p>
          ${hasHint && !isAnswered ? `<div class="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-amber-200 animate-fade-in">📜 <strong>透視卷軸線索：</strong>${qObj.hint || '請觀察時態與詞性搭配！'}</div>` : ''}
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            ${qObj.options.map(opt => {
              const isEliminated = elimList.includes(opt.key);
              let btnStyle = 'bg-slate-900/90 border-slate-700 text-slate-200';
              if (isAnswered) {
                if (opt.key === qObj.answer) btnStyle = 'bg-emerald-500/20 border-emerald-400 text-emerald-200 font-semibold';
                else if (opt.key === chosen) btnStyle = 'bg-rose-500/20 border-rose-500 text-rose-200';
                else btnStyle = 'bg-slate-900/40 border-slate-800 text-slate-500';
              } else if (isEliminated) { btnStyle = 'bg-slate-950/60 border-slate-800 text-slate-600 line-through opacity-50'; }
              return `<button type="button" data-qid="${qObj.id}" data-opt="${opt.key}" ${isAnswered || isEliminated ? 'disabled' : ''} class="option-btn min-h-[46px] text-left px-3.5 py-2.5 rounded-xl border text-sm flex items-center gap-2.5 cursor-pointer disabled:cursor-default ${btnStyle}"><span class="w-6 h-6 rounded-md bg-slate-800 text-xs font-bold flex items-center justify-center shrink-0">${opt.key}</span><span>${opt.text}</span></button>`;
            }).join('')}
          </div>
          ${isAnswered ? `<div class="animate-fade-in mt-2 p-3.5 rounded-xl bg-slate-900/95 border border-amber-500/30 text-xs sm:text-sm text-slate-200 leading-relaxed">${qObj.rationale}</div>` : ''}
        </div>
      `;
    }

    function bindQuestionActions(questionList, storeObj, onAllDone) {
      document.querySelectorAll('.option-btn[data-qid]').forEach(btn => {
        btn.addEventListener('click', () => {
          const qObj = questionList.find(x => x.id === btn.dataset.qid);
          recordAnswer(qObj, btn.dataset.opt, storeObj);
          if (onAllDone && Object.keys(storeObj).length === questionList.length) onAllDone();
          render();
        });
      });
      document.querySelectorAll('[data-use-compass]').forEach(btn => {
        btn.addEventListener('click', () => {
          const qid = btn.dataset.useCompass, qObj = questionList.find(x => x.id === qid);
          if (!qObj || State.consumables.compass <= 0 || State.eliminatedOpts[qid]) return;
          AudioEngine.heal(); State.consumables.compass -= 1;
          State.eliminatedOpts[qid] = qObj.options.filter(o => o.key !== qObj.answer).map(o => o.key).slice(0, 2);
          saveProgress(); showToast('🧭 已使用 50/50 羅盤，劃掉 2 個干擾選項！'); render();
        });
      });
      document.querySelectorAll('[data-use-scroll]').forEach(btn => {
        btn.addEventListener('click', () => {
          const qid = btn.dataset.useScroll;
          if (State.consumables.scroll <= 0 || State.revealedHints[qid]) return;
          AudioEngine.heal(); State.consumables.scroll -= 1; State.revealedHints[qid] = true;
          saveProgress(); showToast('📜 已展開透視卷軸，顯示本題考點線索！'); render();
        });
      });
      document.querySelectorAll('.btn-enc-action').forEach(btn => {
        btn.addEventListener('click', () => rollD20Encounter(btn.dataset.encStage, ENCOUNTERS[btn.dataset.encStage].actions[Number(btn.dataset.encIdx)]));
      });
    }

    function render() {
      saveProgress();
      updateHUD();
      if (State.screen === 'title') renderTitle();
      else if (State.screen === 'act1') renderAct1();
      else if (State.screen === 'hub') renderHub();
      else if (State.screen === 'portal') renderPortal();
      else if (State.screen === 'act3') renderAct3();
      else if (State.screen === 'act4') renderAct4();
      else if (State.screen === 'act5') renderAct5();
      else if (State.screen === 'ending') renderEnding();
      bindVocabChips();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectClass(clsId) {
      AudioEngine.click(); State.playerClass = clsId; State.rangerDodgeUsed = false;
      if (clsId === 'scholar') State.consumables = { elixir: 1, compass: 1, scroll: 2 };
      else if (clsId === 'ranger') State.consumables = { elixir: 1, compass: 1, scroll: 1 };
      else if (clsId === 'bard') State.consumables = { elixir: 2, compass: 2, scroll: 1 };
      render();
    }

          ${allDone ? `<div class="rpg-card rounded-2xl p-5 border-emerald-500/50 text-center space-y-3 animate-fade-in"><div class="text-2xl">🌈 試煉通過！獲得【多巴胺霓虹披風】</div><p class="text-sm text-slate-300">無面騎士化作光點消散，畫廊盡頭的三扇傳送門同時亮起！</p><button id="btn-to-hub" type="button" class="w-full sm:w-auto px-6 min-h-[48px] rounded-xl bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-white font-bold cursor-pointer">🚪 前往 Act II：選擇傳送門</button></div>` : ''}

      const lines = [
        '【高二英文 TRPG｜地下迴廊戰報】',
        State.studentName && State.studentName.trim() ? `🪪 學生姓名：${State.studentName.trim()}` : '🪪 學生姓名：（未填寫）',
        `🎭 冒險職業：${clsObj.icon} ${clsObj.name}`,
        `❤️ HP：${State.hp}/${State.maxHp} ｜ 🔮 理智：${State.san}/${State.maxSan} ｜ ✨ 總 XP：${State.xp}`,
        `🎒 收集裝備：${State.inventory.length}/8 件`,
        '',
        '📊 各幕作答率：',
        `- Act I 地下畫廊：${calcAccuracy(ACT1_QUESTIONS, State.act1Answers)}`,
        `- Act II 左之門（諾曼晚宴）：${calcAccuracy(PORTALS.left.questions, State.portalAnswers.left || {})}`,
        `- Act II 中之門（沙漠溫室）：${calcAccuracy(PORTALS.center.questions, State.portalAnswers.center || {})}`,
        `- Act II 右之門（太空軌道）：${calcAccuracy(PORTALS.right.questions, State.portalAnswers.right || {})}${State.chunkSolved ? ' + 戰報重組✔' : ''}`,
        `- Act III 午夜列車 (U7-8)：${calcAccuracy(ACT3_QUESTIONS, State.act3Answers)}`,
        `- Act IV 能量飲實驗室 (U9)：${calcAccuracy(ACT4_QUESTIONS, State.act4Answers)}`,
        `- Act V 包浩斯終章 (U10-11)：${calcAccuracy(ACT5_QUESTIONS, State.act5Answers)}${State.act5ChunkSolved ? ' + 封印陣✔' : ''}`,
        ''
      ];
      if (State.mistakes.length === 0) lines.push('🌟 錯題紀錄：0 題（全對通關！）');
      else {
        lines.push(`❌ 錯題清單（共 ${State.mistakes.length} 題）：`);
        State.mistakes.forEach((m, idx) => lines.push(`${idx + 1}. ${m.title}｜選 (${m.chosen}) → 正解 (${m.answer})`));
      }
      return lines.join('\n');
    }

    async function submitBattleReport() {
      if (!State.studentName || !State.studentName.trim()) {
        const nameInput = prompt('請輸入你的「班級與姓名／座號」（例如：205 王小明）：');
        if (!nameInput || !nameInput.trim()) {
          showToast('⚠️ 需要先填寫姓名才能繳交成績喔！');
          return;
        }
        State.studentName = nameInput.trim();
        saveProgress();
      }

      const btn = document.getElementById('btn-submit-sheet');
      if (btn) { btn.disabled = true; btn.textContent = '⏳ 正在傳送戰報至老師試算表...'; }

      const clsObj = CLASSES[State.playerClass] || CLASSES.scholar;
      const totalCleared = State.clearedPortals.length;
      const act3Done = Object.keys(State.act3Answers).length === ACT3_QUESTIONS.length;
      const act4Done = Object.keys(State.act4Answers).length === ACT4_QUESTIONS.length;
      const act5Done = Object.keys(State.act5Answers).length === ACT5_QUESTIONS.length && State.act5ChunkSolved;

      const payload = {
        secret: WEBHOOK_SECRET,
        studentName: State.studentName.trim(),
        className: `${clsObj.icon} ${clsObj.name}`,
        hp: State.hp,
        san: State.san,
        xp: State.xp,
        itemCount: `${State.inventory.length}/8`,
        act1: calcAccuracy(ACT1_QUESTIONS, State.act1Answers),
        act2Left: calcAccuracy(PORTALS.left.questions, State.portalAnswers.left || {}),
        act2Center: calcAccuracy(PORTALS.center.questions, State.portalAnswers.center || {}),
        act2Right: calcAccuracy(PORTALS.right.questions, State.portalAnswers.right || {}) + (State.chunkSolved ? ' + 重組✔' : ''),
        act3: calcAccuracy(ACT3_QUESTIONS, State.act3Answers),
        act4: calcAccuracy(ACT4_QUESTIONS, State.act4Answers),
        act5: calcAccuracy(ACT5_QUESTIONS, State.act5Answers) + (State.act5ChunkSolved ? ' + 封印✔' : ''),
        mistakeCount: State.mistakes.length,
        mistakeDetail: State.mistakes.map(m => `${m.title}(選${m.chosen}/正${m.answer})`).join('；'),
        fullClear: totalCleared === 3 && act3Done && act4Done && act5Done
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.ok) {
          State.reportSubmitted = true;
          saveProgress();
          AudioEngine.correct();
          showToast('✅ 戰報已自動寫入老師的 Google Sheets！');
          if (btn) btn.textContent = '✅ 已繳交至老師成績表';
        } else {
          throw new Error(result.error || 'Unknown error');
        }
      } catch (err) {
        AudioEngine.wrong();
        showToast('❌ 傳送失敗，請改按「複製戰報」貼到 Line');
        if (btn) { btn.disabled = false; btn.textContent = '🚀 重試繳交至老師成績表'; }
      }
    }

    function copyBattleReport() {
      const text = buildBattleReport();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => { AudioEngine.correct(); showToast('✅ 戰報已複製！可直接貼到 Line 傳給老師'); }).catch(() => fallbackCopyText(text));
      } else { fallbackCopyText(text); }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); AudioEngine.correct(); showToast('✅ 戰報已複製！可直接貼到 Line 傳給老師'); }
      catch (e) { showToast('⚠️ 無法自動複製，請手動全選下方戰報框複製'); }
      document.body.removeChild(ta);
    }

    function renderEnding() {
      const totalCleared = State.clearedPortals.length;
      const act3Done = Object.keys(State.act3Answers).length === ACT3_QUESTIONS.length;
      const act4Done = Object.keys(State.act4Answers).length === ACT4_QUESTIONS.length;
      const act5Done = Object.keys(State.act5Answers).length === ACT5_QUESTIONS.length && State.act5ChunkSolved;
      const isFullClear = totalCleared === 3 && act3Done && act4Done && act5Done;
      const isTrueEnding = isFullClear && State.mistakes.length === 0;
      const endingTitle = isTrueEnding ? '🌟 隱藏真結局：全五幕零失誤的時空文法宗師' : isFullClear ? '👑 傳奇結局：制霸五幕的地下迴廊大宗師' : (act3Done && act4Done && act5Done) ? '⚡ 後半段完全破關：U7–U11 實戰征服者' : totalCleared === 3 ? '🏆 黃金結局：三門全破的迴廊英雄' : (State.clearedPortals.length > 0 ? PORTALS[State.clearedPortals[State.clearedPortals.length - 1]].ending.title : '🎲 地下迴廊階段戰報結算');
      const endingDesc = isTrueEnding ? '太神了！你零失誤通關了第一幕、三座傳送門以及後半段 Act III～Act V 的全部關卡，集齊 8 件傳奇裝備！' : isFullClear ? '你成功征服了 Act I 到 Act V 的所有章節！點擊下方按鈕即可自動繳交戰報！' : `你目前已收集 ${State.inventory.length} / 8 件裝備（三門完成 ${totalCleared}/3，後半段 Act III–V 完成 ${[act3Done, act4Done, act5Done].filter(Boolean).length}/3）。`;

      $main.innerHTML = `
        <section class="rpg-card rounded-2xl p-6 text-center space-y-5 animate-fade-in">
          <div class="text-4xl">${isTrueEnding ? '👑' : '🎖️'}</div>
          <h2 class="text-2xl font-bold text-amber-300">${endingTitle}</h2>
          <p class="text-sm sm:text-base text-slate-300 leading-relaxed">${endingDesc}</p>
          <div class="grid grid-cols-3 gap-3 bg-slate-900/90 p-4 rounded-xl border border-slate-800 text-sm">
            <div><div class="text-slate-400 text-xs">總經驗值</div><div class="text-amber-300 font-bold text-lg">${State.xp} XP</div></div>
            <div><div class="text-slate-400 text-xs">收集裝備</div><div class="text-emerald-300 font-bold text-lg">${State.inventory.length} / 8</div></div>
            <div><div class="text-slate-400 text-xs">錯題數</div><div class="text-rose-300 font-bold text-lg">${State.mistakes.length} 題</div></div>
          </div>
          <div class="text-left bg-slate-950/90 border border-slate-800 rounded-xl p-3.5 text-xs text-slate-300 font-mono whitespace-pre-wrap max-h-48 overflow-y-auto">${buildBattleReport()}</div>
          <div class="flex flex-wrap gap-3 justify-center pt-2">
            <button id="btn-submit-sheet" type="button" ${State.reportSubmitted ? 'disabled' : ''} class="px-5 min-h-[46px] rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 disabled:opacity-60 text-slate-950 font-bold text-sm cursor-pointer shadow-lg shadow-emerald-500/20">${State.reportSubmitted ? '✅ 已繳交至老師成績表' : '🚀 一鍵繳交戰報至老師成績表'}</button>
            <button id="btn-copy-report" type="button" class="px-5 min-h-[46px] rounded-xl bg-gradient-to-r from-indigo-500 to-sky-500 hover:from-indigo-400 hover:to-sky-400 text-white font-bold text-sm cursor-pointer shadow-lg shadow-sky-500/20">📋 複製戰報（Line 備援）</button>
            ${!act3Done || !act4Done || !act5Done ? `<button id="btn-end-act3" type="button" class="px-5 min-h-[46px] rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-emerald-500/30 font-bold text-sm cursor-pointer">🚆 挑戰後半段 (Act III–V)</button>` : ''}
            ${totalCleared < 3 ? `<button id="btn-end-hub" type="button" class="px-5 min-h-[46px] rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm cursor-pointer">🚪 返回 Act II 大廳</button>` : ''}
            <button id="btn-end-mistakes" type="button" class="px-5 min-h-[46px] rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold text-sm border border-amber-500/30 cursor-pointer">📖 檢視圖鑑與錯題</button>
            <button id="btn-restart" type="button" class="px-5 min-h-[46px] rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm cursor-pointer">↺ 重新開始</button>
          </div>
        </section>
      `;
      document.getElementById('btn-submit-sheet').addEventListener('click', submitBattleReport);
      document.getElementById('btn-copy-report').addEventListener('click', copyBattleReport);
      const bAct3 = document.getElementById('btn-end-act3'); if (bAct3) bAct3.addEventListener('click', () => { AudioEngine.portal(); State.screen = (!act3Done ? 'act3' : !act4Done ? 'act4' : 'act5'); render(); });
      const bHub = document.getElementById('btn-end-hub'); if (bHub) bHub.addEventListener('click', () => { AudioEngine.click(); State.screen = 'hub'; render(); });
      document.getElementById('btn-end-mistakes').addEventListener('click', () => { AudioEngine.click(); State.codexTab = State.mistakes.length > 0 ? 'mistakes' : 'vocab'; openCodexModal(); });
      document.getElementById('btn-restart').addEventListener('click', () => {
        AudioEngine.click();
        State = JSON.parse(JSON.stringify(DEFAULT_STATE));
        saveProgress();
        render();
      });
    }

    document.querySelectorAll('.nav-jump-btn').forEach(btn => btn.addEventListener('click', () => { AudioEngine.click(); State.screen = btn.dataset.navScreen; render(); }));
    document.getElementById('quick-elixir').addEventListener('click', useElixir);
    document.getElementById('dice-close').addEventListener('click', () => { document.getElementById('dice-modal').classList.add('hidden'); document.getElementById('dice-modal').classList.remove('flex'); render(); });

    function bindVocabChips() {
      document.querySelectorAll('.vocab-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          AudioEngine.click(); const v = VOCAB_DB[chip.dataset.vocab]; if (!v) return;
          document.getElementById('vm-tag').textContent = v.tag; document.getElementById('vm-word').textContent = v.word;
          document.getElementById('vm-meaning').textContent = v.meaning; document.getElementById('vm-morph').textContent = v.morph;
          document.getElementById('vm-chunk').textContent = v.chunk;
          document.getElementById('vocab-modal').classList.remove('hidden'); document.getElementById('vocab-modal').classList.add('flex');
        });
      });
    }

    function openCodexModal() {
      const modal = document.getElementById('codex-modal'), body = document.getElementById('codex-body'), tabVocab = document.getElementById('tab-vocab'), tabMistakes = document.getElementById('tab-mistakes');
      if (State.codexTab === 'vocab') {
        tabVocab.className = 'flex-1 py-2 rounded-lg text-sm font-medium bg-amber-500/20 text-amber-200 border border-amber-500/40 cursor-pointer';
        tabMistakes.className = 'flex-1 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 border border-slate-700 cursor-pointer';
        body.innerHTML = Object.values(VOCAB_DB).map(v => `<div class="p-3 rounded-xl bg-slate-900/90 border border-slate-800 space-y-1"><div class="flex items-center justify-between gap-2"><strong class="text-amber-300">${v.word}</strong><span class="text-[11px] text-slate-400">${v.tag}</span></div><div class="text-slate-200 text-xs">${v.meaning}</div><div class="text-sky-300 text-xs">拆解：${v.morph}</div><div class="text-emerald-300 text-xs font-mono">語塊：${v.chunk}</div></div>`).join('');
      } else {
        tabMistakes.className = 'flex-1 py-2 rounded-lg text-sm font-medium bg-rose-500/20 text-rose-200 border border-rose-500/40 cursor-pointer';
        tabVocab.className = 'flex-1 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 border border-slate-700 cursor-pointer';
        body.innerHTML = State.mistakes.length === 0 ? '<div class="text-center py-8 text-slate-400">目前沒有錯題紀錄，繼續保持全對紀錄！</div>' : State.mistakes.map(m => `<div class="p-3.5 rounded-xl bg-slate-900/90 border border-rose-500/30 space-y-1.5"><div class="text-xs font-bold text-rose-300">${m.title}（你的選項：${m.chosen} → 正解：${m.answer}）</div><div class="text-slate-200 text-xs font-medium">${m.stem}</div><div class="text-slate-300 text-xs leading-relaxed">${m.rationale}</div></div>`).join('');
      }
      modal.classList.remove('hidden'); modal.classList.add('flex');
    }

    document.getElementById('vm-close').addEventListener('click', () => { document.getElementById('vocab-modal').classList.add('hidden'); document.getElementById('vocab-modal').classList.remove('flex'); });
    document.getElementById('btn-inventory').addEventListener('click', () => {
      AudioEngine.click();
      const consumablesHtml = `<div class="p-3 rounded-xl bg-slate-900/90 border border-sky-500/30 space-y-2 mb-3"><div class="text-xs font-bold text-sky-300">🧪 主動消耗品</div><div class="flex items-center justify-between text-xs"><span>清醒脈衝解毒藥水（剩 ${State.consumables.elixir} 瓶｜+25 HP / +20 理智）</span><button id="modal-use-elixir" type="button" class="px-2.5 py-1 rounded bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold cursor-pointer">飲用</button></div><div class="text-xs text-slate-300">🧭 50/50 刪去羅盤：剩 ${State.consumables.compass} 枚（請直接在題目右上角點擊使用）</div><div class="text-xs text-slate-300">📜 字源透視卷軸：剩 ${State.consumables.scroll} 張（請直接在題目右上角點擊使用）</div></div>`;
      document.getElementById('inv-list').innerHTML = consumablesHtml + State.inventory.map(id => `<div class="p-3 rounded-xl bg-slate-900/90 border border-emerald-500/25 flex items-start gap-3"><span class="text-2xl">${ITEMS_INFO[id].icon}</span><div><div class="font-bold text-emerald-300 text-sm">${ITEMS_INFO[id].name}</div><div class="text-xs text-slate-300 mt-0.5">${ITEMS_INFO[id].desc}</div></div></div>`).join('');
      document.getElementById('modal-use-elixir').addEventListener('click', () => { useElixir(); document.getElementById('inv-modal').classList.add('hidden'); document.getElementById('inv-modal').classList.remove('flex'); });
      document.getElementById('inv-modal').classList.remove('hidden'); document.getElementById('inv-modal').classList.add('flex');
    });
    document.getElementById('inv-close').addEventListener('click', () => { document.getElementById('inv-modal').classList.add('hidden'); document.getElementById('inv-modal').classList.remove('flex'); });
    document.getElementById('btn-codex').addEventListener('click', () => { AudioEngine.click(); openCodexModal(); });
    document.getElementById('codex-close').addEventListener('click', () => { document.getElementById('codex-modal').classList.add('hidden'); document.getElementById('codex-modal').classList.remove('flex'); });
    document.getElementById('tab-vocab').addEventListener('click', () => { AudioEngine.click(); State.codexTab = 'vocab'; openCodexModal(); });
    document.getElementById('tab-mistakes').addEventListener('click', () => { AudioEngine.click(); State.codexTab = 'mistakes'; openCodexModal(); });
    document.getElementById('btn-mute').addEventListener('click', () => { AudioEngine.muted = !AudioEngine.muted; document.getElementById('btn-mute').textContent = AudioEngine.muted ? '🔇' : '🔊'; if (!AudioEngine.muted) AudioEngine.click(); });
    window.onload = () => { loadProgress(); render(); };
  </script>
</body>
</html>
